name: log-anomaly-thesis

# Docker keeps its own copy of each container's console output; cap it (the analysed logs are
# the files in ./logs, which are not affected).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-java-service: &java-service
  restart: unless-stopped
  logging: *logging
  volumes:
    - ./logs:/logs
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

x-java-env: &java-env
  LOG_DIR: /logs
  KAFKA_BOOTSTRAP: kafka:9092
  DB_USER: postgres
  DB_PASSWORD: postgres
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError"

services:
  postgres:
    image: postgres:16
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentdb"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  order-service:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: order-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      SAGA_TIMEOUT_MS: "15000"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  inventory-service:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: inventory-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  payment-service:
    <<: *java-service
    build:
      context: .
      args:
        MODULE: payment-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api-gateway:
    logging: *logging
    build:
      context: .
      args:
        MODULE: api-gateway
    restart: unless-stopped
    environment:
      LOG_DIR: /logs
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError"
    volumes:
      - ./logs:/logs
    ports:
      - "8080:8080"
    depends_on:
      - order-service
      - inventory-service
      - payment-service
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ml-detector:
    logging: *logging
    build:
      context: ./ml-detector
    restart: unless-stopped
    environment:
      LOG_DIR: /logs
      LABELS_PATH: /results/labels.csv
      RESULTS_DIR: /results/detector
      RESULTS_ROOT: /results
      MODEL_DIR: /models
      # used by the dashboard for service health and fault injection
      GATEWAY_URL: http://api-gateway:8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      LIVE_DETECTION: "true"
      # Telegram alerts: put the values in a .env file next to this file (see .env.example)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFY_METHODS: ${NOTIFY_METHODS:-rules,isolation_forest,random_forest}
      NOTIFY_RESOLVE_AFTER_S: ${NOTIFY_RESOLVE_AFTER_S:-60}
    volumes:
      - ./logs:/logs
      - ./results:/results
      - ./models:/models
    ports:
      - "8000:8000"

  experiment:
    logging: *logging
    profiles: ["experiment"]
    build:
      context: ./experiment
    environment:
      GATEWAY_URL: http://api-gateway:8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
    volumes:
      - ./logs:/logs
      - ./results:/results
    depends_on:
      - api-gateway
    command: ["--out", "/results"]

volumes:
  pgdata:
